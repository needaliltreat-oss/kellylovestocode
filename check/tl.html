<!doctype html><meta charset="utf-8"><title>check</title>
<style>body{font:12px monospace;margin:8px}iframe{border:1px solid #999;display:block;margin:8px 0}pre{white-space:pre-wrap}</style>
<pre id="out">running</pre><div id="fr"></div>
<script>
const SHA=new URLSearchParams(location.search).get("sha");
const BASE=`https://raw.githack.com/needaliltreat-oss/kellylovestocode/${SHA}/studio/`;
const W=[1440,1024,820,390,320],res={},out=document.getElementById("out");
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const show=()=>out.textContent=JSON.stringify(res,null,1);
(async()=>{
 const html=await (await fetch(BASE+"index.html",{cache:"no-store"})).text();
 const inj=`<base href="${BASE}"><script>window.__err=[];addEventListener("error",e=>__err.push(String(e.message||e.type)+" @"+((e.target&&e.target.src)||e.filename||"").split("/").pop()+":"+(e.lineno||"")),true);<\/script>`;
 const doc=html.replace(/<head[^>]*>/i,m=>m+inj);
 for(const w of W){
  const f=document.createElement("iframe");f.width=w;f.height=820;f.srcdoc=doc;document.getElementById("fr").append(f);
  await new Promise(r=>f.onload=r);await sleep(2000);
  const d=f.contentDocument,win=f.contentWindow,r={};
  d.querySelector('a[data-open="titrelab"]').click();await sleep(2500);
  const p=d.getElementById("opened");r.panelOn=p.classList.contains("on");r.dataP=p.dataset.p;r.panelOverflow=p.scrollWidth-p.clientWidth;
  const im=d.querySelector("#pbody img.tl-logo");
  if(im){await (im.decode?im.decode().catch(e=>r.decodeErr=String(e)):0);
   const b=im.getBoundingClientRect(),cs=win.getComputedStyle(im);
   r.logo={src:im.getAttribute("src"),loaded:im.complete&&im.naturalWidth>0,natural:[im.naturalWidth,im.naturalHeight],box:[+b.width.toFixed(1),+b.height.toFixed(1)],fit:cs.objectFit,border:cs.borderStyle,alt:im.alt};
   const ov=d.querySelector("#pbody .gb-ov .lede").getBoundingClientRect(),h=d.querySelector("#pbody .gb-ov h3").getBoundingClientRect();
   r.overlapText=!(b.right<=h.left||b.bottom<=h.top)||!(b.right<=ov.left||b.bottom<=ov.top);
   r.layout=b.bottom<=h.top+1?"logo above overview":"logo beside overview";
   r.logoInPanel=b.left>=0&&b.right<=w;
  } else r.logo="missing";
  r.placeholderText=[...d.querySelectorAll("#pbody .tl-logo")].map(e=>e.textContent).join("|");
  r.errors=win.__err.slice(0,5);
  res[w]=r;show();
 }
 res.done=true;show();
})().catch(e=>{res.fatal=String(e);show()});
</script>
