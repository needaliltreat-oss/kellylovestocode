<!doctype html><meta charset="utf-8"><title>check ov</title>
<style>body{font:12px monospace;margin:8px}iframe{border:1px solid #999;display:block;margin:8px 0}pre{white-space:pre-wrap}</style>
<pre id="out">running</pre><div id="fr"></div>
<script>
const SHA=new URLSearchParams(location.search).get("sha");
const BASE=`https://raw.githack.com/needaliltreat-oss/kellylovestocode/${SHA}/studio/`;
const W=[1440,1024,820,390,320],P=["gigbag","titrelab","phytofoundry"],res={},out=document.getElementById("out");
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const show=()=>out.textContent=JSON.stringify(res);
const R=b=>[+b.left.toFixed(0),+b.top.toFixed(0),+b.width.toFixed(0),+b.height.toFixed(0)];
const hit=(a,b)=>!(a.right<=b.left||b.right<=a.left||a.bottom<=b.top||b.bottom<=a.top);
(async()=>{
 const html=await (await fetch(BASE+"index.html",{cache:"no-store"})).text();
 const inj=`<base href="${BASE}"><script>window.__err=[];addEventListener("error",e=>__err.push(String(e.message||e.type)+" @"+((e.target&&e.target.src)||e.filename||"").split("/").pop()+":"+(e.lineno||"")),true);<\/script>`;
 const doc=html.replace(/<head[^>]*>/i,m=>m+inj);
 for(const w of W)for(const pid of P){
  const f=document.createElement("iframe");f.width=w;f.height=820;f.srcdoc=doc;document.getElementById("fr").append(f);
  await new Promise(r=>f.onload=r);await sleep(1500);
  const d=f.contentDocument,win=f.contentWindow,r={};
  d.querySelector(`a[data-open="${pid}"]`).click();await sleep(2400);
  const p=d.getElementById("opened");r.on=p.classList.contains("on")&&p.dataset.p===pid;r.hOverflow=Math.max(p.scrollWidth-p.clientWidth,d.documentElement.scrollWidth-w);
  const ov=d.querySelector("#pbody .gb-ov"),txt=ov.querySelector(".lede").getBoundingClientRect(),h3=ov.querySelector("h3").getBoundingClientRect();
  const imgs=[...ov.querySelectorAll(".gb-logo,.gb-word")];
  r.marks=imgs.map(im=>{const b=im.getBoundingClientRect();return {c:im.className,loaded:im.tagName!=="IMG"?"n/a":(im.complete&&im.naturalWidth>0),box:R(b),inView:b.left>=0&&b.right<=w,hitsText:hit(b,txt)||hit(b,h3)}});
  const first=imgs[0].getBoundingClientRect();
  r.layout=first.left>=txt.right-1?"marks right of text":first.bottom<=h3.top+1?"marks above text":first.right<=txt.left+1?"marks left of text":"other";
  r.text=R(txt);
  if(imgs.length>1){const a=imgs[0].getBoundingClientRect(),b=imgs[1].getBoundingClientRect();r.markGap=+(b.top-a.bottom).toFixed(0);r.marksOverlap=hit(a,b)}
  r.err=win.__err.slice(0,4);
  res[w+"/"+pid]=r;show();f.remove();
 }
 const f=document.createElement("iframe");f.width=1440;f.height=820;f.srcdoc=doc;document.getElementById("fr").append(f);await new Promise(r=>f.onload=r);await sleep(1500);
 const t=f.contentDocument.getElementById("pg-about");res.aboutIntro=(t?t.innerHTML:"").match(/Clients and projects[^<]*/)?.[0];
 res.done=true;show();
})().catch(e=>{res.fatal=String(e);show()});
</script>
