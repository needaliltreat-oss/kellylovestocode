<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<style>body{margin:0;background:#888}iframe{border:0;display:block;background:#fff;height:100vh}</style>
<iframe id="f"></iframe>
<script>const w=+(parseInt(location.hash.slice(1))||390);const f=document.getElementById("f");f.style.width=w+"px";f.src="index.html";f.onload=()=>setTimeout(()=>{if(location.hash.includes("a"))f.contentDocument.getElementById("alink").click()},1500);setInterval(()=>{try{document.title=f.contentDocument.title}catch(e){}},500)</script>
